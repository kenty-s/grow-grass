<!DOCTYPE html>
<html>
<head>
    <title>console.logテスト</title>
</head>
<body>
    <h1>console.logのテスト</h1>
    <p>F12を押してConsoleタブを確認してください</p>
    
    <script>
        console.log("🎉 HTMLファイルから実行されました！");
        
        let userName = "田中さん";
        let userAge = 30;
        
        console.log("名前:", userName);
        console.log("年齢:", userAge);
        
        // オブジェクトも試してみる
        let user = {
            name: "田中さん",
            age: 30,
            city: "東京"
        };
        console.log("ユーザー情報:", user);
    </script>
</body>
</html>
